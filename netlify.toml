# Netlify settings. These override the build settings in the Netlify UI.
# KONTENT_* variables and the Node version (.node-version) are set elsewhere.

[build]
  # verify:build fails the deploy if createPages produced no article, journal
  # or tag pages, which otherwise still "succeeds" (see AGENTS.md).
  command = "npm run build && npm run verify:build"
  publish = "public"

# Hashed assets under /static/ and the JS/CSS bundles are cached immutably by
# gatsby-adapter-netlify, so only security headers are set here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
